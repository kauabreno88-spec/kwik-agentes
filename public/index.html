<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KWIK Agentes</title>
  <meta name="description" content="Painel da KWIK: veja ao vivo o que o Claude Code e o Codex estão fazendo." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    try {
      const t = localStorage.getItem('kwik:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Símbolo KWIK: barras de crescimento + a letra K + seta ascendente. -->
      <symbol id="kwik-glyph" viewBox="0 0 100 100" overflow="visible">
        <rect x="3" y="58" width="11.3" height="39" />
        <rect x="19" y="37.8" width="11.3" height="59.2" />
        <rect x="35.9" y="21.8" width="11.3" height="75.2" />
        <polygon points="36.7,56.3 77.2,14.8 71,9 100.5,-0.5 92,29 85.8,23.2 45.3,64.7" />
        <polygon points="59.9,56.9 97,92.1 97,97 84.4,97 51.4,65.7" />
      </symbol>
      <symbol id="kwik-mark" viewBox="-2 -4 106 106">
        <rect class="mark-frame" x="1.5" y="1.5" width="97" height="97" />
        <use href="#kwik-glyph" class="mark-glyph" x="0" y="0" width="100" height="100" />
      </symbol>
    </defs>
  </svg>

  <header class="top">
    <a class="brand" href="/" aria-label="KWIK Agentes">
      <svg class="mark" aria-hidden="true"><use href="#kwik-mark" /></svg>
      <span class="wordmark"><b>KWIK</b><small>Contabilidade inteligente</small></span>
    </a>
    <span class="brand-sep" aria-hidden="true"></span>
    <span class="app-name">Agentes</span>
    <span class="conn" id="conn" data-state="connecting"><i aria-hidden="true"></i><span>Conectando…</span></span>
    <div class="top-actions">
      <label class="search">
        <span class="sr">Buscar agente ou projeto</span>
        <input id="search" type="search" placeholder="Buscar agente ou projeto" autocomplete="off" />
        <kbd>/</kbd>
      </label>
      <div class="seg" id="filter" role="group" aria-label="Filtrar por agente">
        <button data-f="all" aria-pressed="true">Todos</button>
        <button data-f="claude" aria-pressed="false">Claude Code</button>
        <button data-f="codex" aria-pressed="false">Codex</button>
      </div>
      <button class="btn ghost" id="btn-day" title="Meu dia (M)">Meu dia</button>
      <button class="btn icon" id="btn-theme" title="Claro ou escuro (D)" aria-label="Alternar tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" /></svg>
      </button>
      <button class="btn icon" id="btn-help" title="Ajuda (?)" aria-label="Ajuda">?</button>
    </div>
  </header>

  <div class="demo" id="demo-banner" hidden>Modo demonstração · projetos, agentes e números fictícios · <a href="/">sair</a></div>

  <main>
    <section class="hero">
      <p class="overline" id="today-label">Hoje</p>
      <h1 id="headline">Carregando o <em>painel</em>…</h1>
      <p class="lede" id="lede"></p>
    </section>

    <section class="kpis" id="kpis" aria-label="Números de agora"></section>

    <div class="layout">
      <section class="projects" id="projects" aria-label="Projetos e agentes"></section>
      <aside class="side">
        <section class="card waiting" id="waiting" aria-live="polite"></section>
        <section class="card">
          <p class="overline">Atividade de hoje</p>
          <h3 class="card-title">Pedidos e ferramentas por hora</h3>
          <div class="chart" id="chart"></div>
        </section>
        <section class="card">
          <p class="overline">Agora</p>
          <h3 class="card-title">O que aconteceu</h3>
          <ol class="feed" id="feed"></ol>
        </section>
      </aside>
    </div>
  </main>

  <aside class="drawer" id="drawer" aria-label="Detalhes do agente" hidden></aside>
  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <div class="brand-bar" aria-hidden="true"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
